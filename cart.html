<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart - Tejas Agri Seeds</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

<!-- ================= HEADER ================= -->
<header>
  <div class="container header-container">
    <img src="images/logo.jpg" alt="Tejas Agri Seeds Logo" class="logo" />

    <nav>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="vegetable-seeds.html">Vegetable Seeds</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <div class="nav-icons">
      <i class="fas fa-search"></i>
      <i class="fas fa-user" title="Login / Account"></i>
      <i class="fas fa-shopping-cart"></i>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
  </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-content">
    <h1>Your Cart</h1>
    <p>Review selected seed varieties before ordering.</p>
  </div>
</section>

<!-- ================= CART SECTION ================= -->
<section class="products container">
  <h2>Your Cart</h2>

  <table class="cart-table">
    <thead>
      <tr>
        <th>Product</th>
        <th>Variety</th>
        <th>KG</th>
        <th>Remove</th>
      </tr>
    </thead>
    <tbody id="cartItems"></tbody>
  </table>
  <div class="cart-actions">
  <button id="whatsappOrderBtn" class="whatsapp-btn">
    Proceed to Buy on WhatsApp
  </button>
</div>


  <p id="emptyCartMsg">Your cart is empty.</p>
</section>

<!-- ================= FOOTER ================= -->
<footer>
  <div class="container footer-container">
    <p>© 2025 Tejas Agri Seeds. All Rights Reserved.</p>
  </div>
</footer>

<!-- ================= MODALS ================= -->
<div id="searchModal" class="modal">
  <div class="modal-content">
    <button class="close-btn">&times;</button>
    <h2>Search</h2>
    <input type="text" id="searchInput" placeholder="Search for vegetables..." />
    <button class="learn-more-btn">Search</button>
  </div>
</div>
<script
  async
  crossorigin="anonymous"

</script>





<script src="script.js"></script>
</body>
</html>
